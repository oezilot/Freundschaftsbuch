<!-- Navigation bar with all links: Home, Create/Edit, Logout, and displays the logged-in username -->
<!-- this is the skeleton of each template! -->
<!doctype html>
<html lang="en">

<head>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon/freundschaftsbuch.svg') }}" />

  <!-- NES.css CDN -->
  <link href="https://unpkg.com/nes.css/css/nes.min.css" rel="stylesheet" />
  <!-- Optional: Include a font for better text appearance -->
  <link href="https://fonts.googleapis.com/css?family=Press+Start+2P" rel="stylesheet">

  <meta charset="utf-8">
  <link rel="stylesheet" href="{{ url_for('static', filename='base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='components.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='landing.css') }}">


  <!--ensures that the webpage is rendered correctly on different devices-->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">


  <title>Freundschaftsbuch</title>
</head>

<body>

  <div class="center-horizontally-vertically">
    <div class="component-box-simple">
      <div class="landing-title">
        <h1 class="text-break"><mark>Let's become Friends!</mark></h1>
      </div>
      <br>
      <div class="landing-buttons ">
        <div class="center-horizontally-landing">
          <h2>Sign-In</h2>
          <a class="nes-btn is-primary" href="{{ url_for('auth.login') }}">log In</a>
        </div>
        <div class="center-horizontally-landing">
          <h2>About</h2>
          <a class="nes-btn is-normal" href="{{ url_for('main.about') }}">About</a>
        </div>
        <div class="center-horizontally-landing">
          <h2>Sign-Up</h2>
          <a class="nes-btn is-success" href="{{ url_for('auth.register') }}">Sign Up</a>
        </div>
      </div>
    </div>


  </div>
</body>

</html>
