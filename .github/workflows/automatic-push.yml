name: Sync-Script auf dem Branch Poseidon ausführen

on:
  push:
    branches:
      - Poseidon  # Hier gibst du den Branch an, auf den der Push ausgeführt wird

jobs:
  run-script:
    runs-on: ubuntu-latest  # Der Runner (Ubuntu wird hier als Beispiel verwendet)

    steps:
      # Schritt 1: Repository auschecken
      - name: Checkout Code
        uses: actions/checkout@v3

      # Schritt 2: SSH-Schlüssel einrichten und Server authentifizieren
      - name: SSH-Schlüssel einrichten
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY_PRIVATE_POSEIDON }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 81.6.40.143 >> ~/.ssh/known_hosts

      # Schritt 3: Auf dem Server einloggen und Skript ausführen
      - name: SSH und Skript ausführen
        run: |
          ssh -t -i ~/.ssh/id_rsa zoef@81.6.40.143 "cd /home/zoef/Projects/Freundschaftsbuch && git pull origin Poseidon && echo POSEIDON_PASSWORT | sudo -S systemctl restart freundschaftsbuch.service"
          
