name: Auto-Deploy to Server

on:
  push:
    branches:
      - tamagotchi-server

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest

    steps:
      # 1. Repository klonen
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. SSH einrichten
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY_PRIVATE_TAMAGOTCHI }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 127.0.0.1 >> ~/.ssh/known_hosts

      # 3. Änderungen auf dem Server bereitstellen
      - name: Pull changes and restart service
        run: |
          ssh -i ~/.ssh/id_rsa zvowevan@127.0.0.1 << 'EOF'
          cd /Projects/Freundschaftsbuch
          git pull origin tamagotchi-server
          sudo systemctl restart freundschaftsbuch.service
          EOF
