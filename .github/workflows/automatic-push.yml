name: Skript bei Push auf tamagotchi-server ausführen

on:
  push:
    branches:
      - tamagotchi-server  # Hier gibst du den Branch an, auf den der Push ausgeführt wird

jobs:
  run-script:
    runs-on: ubuntu-latest  # Der Runner (Ubuntu wird hier als Beispiel verwendet)

    steps:
      # Schritt 1: Repository auschecken
      - name: Checkout Code
        uses: actions/checkout@v2

      # Schritt 2: Skript ausführen
      - name: Skript ausführen
        run: |
          echo "Wechsel zu einem bestimmten Ordner und führe das Skript aus..."
          cd home/zvowevan/Projects/Webhook-Server || exit 1  # Wechsel in den gewünschten Ordner
          ./git_sync_freundschaftsbuch.sh  # Hier gibst du den Namen deines Skripts an
