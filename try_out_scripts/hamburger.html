<style>
    #hamburger {
        display: flex;
        flex-direction:column;
        justify-content:space-between;
        width: 100px;
        height: 100px;
    }
    .strich {
        background-color: black;
        width: 100%;
        height: 25%;
    }
    .cross #strich1 {
        transform: translateY(38px) rotate(45deg); /*45rotieren und den strich ein wenig runter schieben auf der y-achse*/
    }
    .cross #strich2 {
        opacity: 0; /*45rotieren und den strich ein wenig runter schieben auf der y-achse*/
    }
    .cross #strich3 {
        transform: translateY(-38px) rotate(-45deg); /*45rotieren und den strich ein wenig runter schieben auf der y-achse*/
    }
</style>

<div id="hamburger" class="" onclick="hamburgerRotation(this)">
    <div class="strich" id="strich1"></div>
    <div class="strich" id="strich2"></div>
    <div class="strich" id="strich3"></div>
</div>

<div></div>

<script>
    function hamburgerRotation(element) { // class lst represent the list of all classes a dom-element has like class="class1 class2, ... -> here we are talking about the classes of the hamburger-div"
        element.classList.toggle("cross"); // the class cross gets added if it doesnt exist and if it exists it gets removed from the classlist!
    }
</script>
