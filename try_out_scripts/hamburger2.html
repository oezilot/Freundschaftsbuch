<!--

tipp1:
- something like this #hamburger.cross ~ #hamburger-wall only works if both elements are in the same parent-element!

-->

<style>

    /* hamburger */
    #hamburger {
        display: none;
        flex-direction:column;
        justify-content:space-between;
        width: 1rem;
        height: 1rem;
    }
    .strich {
        background-color: black;
        width: 100%;
        height: 25%;
    }
    .cross #strich1 {
        transform: translateY(0.38rem) rotate(45deg); /*45rotieren und den strich ein wenig runter schieben auf der y-achse*/
    }
    .cross #strich2 {
        opacity: 0; /*45rotieren und den strich ein wenig runter schieben auf der y-achse*/
    }
    .cross #strich3 {
        transform: translateY(-0.38rem) rotate(-45deg); /*45rotieren und den strich ein wenig runter schieben auf der y-achse*/
    }

    /* hamburger wall */
    #hamburger-wall {
        display:none;
    }
    nav.nav-open ~ #hamburger-wall {
        display:block;
    }
    
    /* hamburger wall */
    nav.nav-open ~ .content {
        display:none;
    }

    nav {
        display:flex;
        flex-direction:row;
        gap: 12px;
    }

    /* responsive design */
    @media (max-width: 400px) {
 
        .nav-link {
            display:none;
        }
        #hamburger {
            display: flex;
        }
    }
</style>

<hr>
<nav class="navigation">
    <div id="hamburger" class="" onclick="hamburgerRotation(this)">
        <div class="strich" id="strich1"></div>
        <div class="strich" id="strich2"></div>
        <div class="strich" id="strich3"></div>
    </div>
    <a class="nav-link" href="#">Hello</a>
    <a class="nav-link" href="#">Thema</a>
    <a class="nav-link" href="#">Liebe</a>
</nav>
<hr>

<div class="content" style="background-color: pink;">
    Inhaltsverzeichnis
</div>

<div id="hamburger-wall">
    <h2 class="option">Option 1</h2>
    <hr>
    <h2 class="option">Option 2</h2>
    <hr>
    <h2 class="option">Option 3</h2>
</div>

<script>
    let burger_state = false;
    function hamburgerRotation(element) { // class lst represent the list of all classes a dom-element has like class="class1 class2, ... -> here we are talking about the classes of the hamburger-div"
        element.classList.toggle("cross"); // the class cross gets added if it doesnt exist and if it exists it gets removed from the classlist!
        element.parentElement.classList.toggle("nav-open");
    }
</script>
